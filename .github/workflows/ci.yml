name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal test tools)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o ferry ./cmd/ferry
      - run: go run ./tools/sitegen -ferry ./ferry -out site && go run ./tools/sitecheck -site site
