name: Something does not work
description: A transfer fails, a command misbehaves, an error does not help.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. On machine A: ferry send ./file
        2. On machine B: ferry get <code>
        3. ...
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `ferry check` on both machines
      description: It shows nothing secret. Remove addresses if you prefer.
      render: text
  - type: input
    id: version
    attributes:
      label: ferry version and OS
      placeholder: ferry v0.1.0 on Ubuntu 24.04 / macOS 15
    validations:
      required: true
